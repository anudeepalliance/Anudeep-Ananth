# projects.anudeepananth.com: Ktor server (API + web app) behind shared-nginx.
# Joins baedrop_default so it can reach peekopals-mongo and n8n-app by name,
# and so shared-nginx can reach it. Do not publish ports.
services:
  anudeep-projects:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: anudeep-projects:latest
    container_name: anudeep-projects
    restart: unless-stopped
    expose:
      - "8585"
    environment:
      - PORT=8585
    networks:
      - baedrop_default
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:8585/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 0.40

networks:
  baedrop_default:
    external: true
