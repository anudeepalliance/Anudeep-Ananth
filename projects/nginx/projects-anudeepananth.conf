# ==============================================================================
# projects.anudeepananth.com: Cloudflare-proxied, HTTP + HTTPS (self-signed origin)
# Dropped into shared-nginx /etc/nginx/conf.d/ next to the existing vhosts.
# ==============================================================================

upstream anudeep_projects_backend {
    server anudeep-projects:8585;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name projects.anudeepananth.com;

    ssl_certificate /etc/letsencrypt/live/selfsigned/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/selfsigned/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/projects-anudeepananth-access.log;
    error_log /var/log/nginx/projects-anudeepananth-error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex" always;

    # Live run progress (server-sent events): never buffer, and allow a full 15-minute run.
    location ~ ^/api/ocrolus/runs/[^/]+/events$ {
        proxy_pass http://anudeep_projects_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        add_header X-Accel-Buffering "no" always;
    }

    location / {
        proxy_pass http://anudeep_projects_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
